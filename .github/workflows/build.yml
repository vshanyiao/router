name: Build & Push Images

on:
  push:
    branches: [main]

# OIDC federation for aws-actions/configure-aws-credentials.
permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-east-1

jobs:
  build:
    name: build & push (web + proxy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push maas-web
        env:
          ECR: ${{ steps.ecr.outputs.registry }}
          SHA: ${{ github.sha }}
        run: |
          docker build -f web/Dockerfile.prod \
            -t "$ECR/maas-web:$SHA" \
            -t "$ECR/maas-web:latest" \
            web
          docker push "$ECR/maas-web:$SHA"
          docker push "$ECR/maas-web:latest"

      - name: Build & push maas-proxy
        env:
          ECR: ${{ steps.ecr.outputs.registry }}
          SHA: ${{ github.sha }}
        run: |
          docker build -f proxy/Dockerfile.prod \
            -t "$ECR/maas-proxy:$SHA" \
            -t "$ECR/maas-proxy:latest" \
            proxy
          docker push "$ECR/maas-proxy:$SHA"
          docker push "$ECR/maas-proxy:latest"
