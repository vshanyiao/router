apiVersion: v1
kind: ServiceAccount
metadata:
  name: maas-proxy
  namespace: maas
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: proxy
  namespace: maas
  labels:
    app: proxy
spec:
  replicas: 2
  selector:
    matchLabels:
      app: proxy
  template:
    metadata:
      labels:
        app: proxy
    spec:
      serviceAccountName: maas-proxy
      containers:
        - name: proxy
          image: ${ECR_REGISTRY}/maas-proxy:${IMAGE_TAG}
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: maas-secrets
          env:
            - name: RATE_LIMIT_USER_RPM
              value: "60"
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
