# External Secrets Operator (ESO) wiring.
#
# The SecretStore authenticates to AWS Secrets Manager via IRSA (IAM Roles for
# Service Accounts) — the `external-secrets` service account below is annotated
# with the IAM role ARN by CloudFormation/eksctl. The ExternalSecret then
# projects individual keys from the `maas/prod` secret into a native K8s Secret
# named `maas-secrets`, which the web and proxy Deployments consume via envFrom.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets
  namespace: maas
  annotations:
    # PLACEHOLDER: IAM role granting secretsmanager:GetSecretValue on maas/prod.
    eks.amazonaws.com/role-arn: ${ESO_IRSA_ROLE_ARN}
---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: maas
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: maas-secrets
  namespace: maas
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: maas-secrets
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: maas/prod
        property: database-url
    - secretKey: REDIS_URL
      remoteRef:
        key: maas/prod
        property: redis-url
    - secretKey: NEXTAUTH_SECRET
      remoteRef:
        key: maas/prod
        property: nextauth-secret
    - secretKey: GITHUB_CLIENT_ID
      remoteRef:
        key: maas/prod
        property: github-client-id
    - secretKey: GITHUB_CLIENT_SECRET
      remoteRef:
        key: maas/prod
        property: github-client-secret
    - secretKey: RESEND_API_KEY
      remoteRef:
        key: maas/prod
        property: resend-api-key
    - secretKey: HMAC_SERVER_SECRET
      remoteRef:
        key: maas/prod
        property: hmac-server-secret
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: maas/prod
        property: openai-api-key
    - secretKey: ANTHROPIC_API_KEY
      remoteRef:
        key: maas/prod
        property: anthropic-api-key
    - secretKey: GEMINI_API_KEY
      remoteRef:
        key: maas/prod
        property: gemini-api-key
    - secretKey: STRIPE_SECRET_KEY
      remoteRef:
        key: maas/prod
        property: stripe-secret-key
    - secretKey: STRIPE_WEBHOOK_SECRET
      remoteRef:
        key: maas/prod
        property: stripe-webhook-secret
    - secretKey: TURNSTILE_SECRET_KEY
      remoteRef:
        key: maas/prod
        property: turnstile-secret-key
