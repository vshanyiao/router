services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: maas
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d maas"]
      interval: 2s
      timeout: 2s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 10

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    command: pnpm dev
    volumes:
      - ./web:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://app:dev@postgres:5432/maas
      REDIS_URL: redis://redis:6379
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      RESEND_API_KEY: ${RESEND_API_KEY}
      EMAIL_FROM: ${EMAIL_FROM}
      HMAC_SERVER_SECRET: ${HMAC_SERVER_SECRET}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY}
      # Playground server-proxies to the Go inference service over the compose network.
      PROXY_URL: http://proxy:8080
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  proxy:
    build:
      context: ./proxy
      dockerfile: Dockerfile
    command: air
    volumes:
      - ./proxy:/app
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://app:dev@postgres:5432/maas
      REDIS_URL: redis://redis:6379
      HMAC_SERVER_SECRET: ${HMAC_SERVER_SECRET}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      RATE_LIMIT_USER_RPM: ${RATE_LIMIT_USER_RPM:-60}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Opt-in stripe-cli for forwarding webhook events to the local web service.
  # Start with: `docker compose --profile billing up`
  # The first `stripe listen` output prints a whsec_... value — copy that into
  # `.env` as STRIPE_WEBHOOK_SECRET, then restart the web service.
  stripe-cli:
    image: stripe/stripe-cli:latest
    profiles: ["billing"]
    command: listen --forward-to web:3000/api/stripe-webhook
    environment:
      STRIPE_API_KEY: ${STRIPE_SECRET_KEY}
    depends_on:
      - web

volumes:
  pgdata:
